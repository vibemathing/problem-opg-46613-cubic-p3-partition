name: web-candidate-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  candidate-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned schema validator
        run: python -m pip install --require-hashes -r requirements-web-harness.txt
      - name: Validate immutable Harness snapshot
        run: python3 scripts/validate_web_problem_harness.py --project-root .
      - name: Validate candidate-only pull request diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: python3 scripts/validate_web_pr_diff.py --project-root . --base "$BASE_SHA" --head HEAD --branch "$HEAD_BRANCH"
      - name: Validate all Web attempt packets
        run: python3 scripts/validate_web_attempt.py --project-root . --all-inbox
